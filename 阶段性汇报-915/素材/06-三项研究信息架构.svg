<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="130" viewBox="0 0 1152 130"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#53657c"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#17263b"><rect x="8" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#2557c7"/><text x="141" y="35" text-anchor="middle" font-size="19" font-weight="600">骨面、轨迹与计划</text><text x="141" y="61" text-anchor="middle" font-size="15" fill="#58667a">共同输入</text><path d="M278 42 H292" fill="none" stroke="#53657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#2557c7"/><text x="431" y="35" text-anchor="middle" font-size="19" font-weight="600">增量重建与质量保持</text><text x="431" y="61" text-anchor="middle" font-size="15" fill="#58667a">研究一：输出骨面、误差与质量</text><path d="M568 42 H582" fill="none" stroke="#53657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="588" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#1a8a5c"/><text x="721" y="35" text-anchor="middle" font-size="19" font-weight="600">异构计算与一致性发布</text><text x="721" y="61" text-anchor="middle" font-size="15" fill="#58667a">研究二：冻结算法，记录版本与延迟</text><path d="M858 42 H872" fill="none" stroke="#53657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="878" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#6743b8"/><text x="1011" y="35" text-anchor="middle" font-size="19" font-weight="600">计划状态与风险表达</text><text x="1011" y="61" text-anchor="middle" font-size="15" fill="#58667a">研究三：剩余量及判断可信范围</text><text x="8" y="111" font-size="16" fill="#3f4c63">箭头表示依赖关系；研究一决定几何，研究二执行并发布，研究三的状态结果送回研究二显示。</text></g></svg>
