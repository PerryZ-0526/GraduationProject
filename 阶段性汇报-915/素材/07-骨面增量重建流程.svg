<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="130" viewBox="0 0 1152 130"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#53657c"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" fill="#17263b"><rect x="8" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#2557c7"/><text x="141" y="35" text-anchor="middle" font-size="19" font-weight="600">初始骨面＋累计扫掠</text><text x="141" y="61" text-anchor="middle" font-size="15" fill="#58667a">独立目标状态</text><path d="M278 42 H292" fill="none" stroke="#53657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="298" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#2557c7" stroke-dasharray="6 4"/><text x="431" y="35" text-anchor="middle" font-size="19" font-weight="600">目标曲面及真实交线</text><text x="431" y="61" text-anchor="middle" font-size="15" fill="#58667a">裁剪与跨域待研究</text><path d="M568 42 H582" fill="none" stroke="#53657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="588" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#1a8a5c" stroke-dasharray="6 4"/><text x="721" y="35" text-anchor="middle" font-size="19" font-weight="600">局部网格＋过渡带</text><text x="721" y="61" text-anchor="middle" font-size="15" fill="#58667a">一般质量生成待研究</text><path d="M858 42 H872" fill="none" stroke="#53657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="878" y="8" width="266" height="69" rx="3" fill="#f4f6f9" stroke="#6743b8"/><text x="1011" y="35" text-anchor="middle" font-size="19" font-weight="600">验收通过后发布</text><text x="1011" y="61" text-anchor="middle" font-size="15" fill="#58667a">拒绝则保留上一状态</text><text x="8" y="111" font-size="16" fill="#3f4c63">受限重建与验收已有证据；虚线框为完整三维任务尚需验证的环节。</text></g></svg>